name: Containers

# Hermetic integration tier: real Omnigent, Codex, Claude Code and Pi in an
# offline container, with only the model responses scripted. Separate from CI so
# the fast unit job never needs a container runtime. Runs when something it
# exercises changes, on main, and nightly to catch drift in the pinned tools.
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "containers/**"
      - "scripts/**"
      - "packages/core/src/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/containers.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTAINER_RUNTIME: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      # Build with buildx so the expensive layers (Python, Omnigent, Codex, the
      # harness downloads) come from the GitHub Actions cache; the version pins
      # still come from containers/versions.ts, printed as build args.
      - name: Resolve build args
        id: build-args
        run: |
          {
            echo "args<<EOF"
            bun scripts/containers/build.ts --print-build-args
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Containerfile
          load: true
          tags: localhost/agent-session-bridge-containers:dev
          build-args: ${{ steps.build-args.outputs.args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container tests
        run: bun run test:containers --no-build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containers-report
          path: |
            ~/.cache/agent-session-bridge/containers/*/out/junit.xml
            ~/.cache/agent-session-bridge/containers/*/out/artifacts/**
          if-no-files-found: ignore
