name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun lint --no-script

      - name: Format
        run: bun fmt --check

      - name: Typecheck
        run: bun check .

      - name: Build
        run: bun run build

      - name: Test
        run: bun test

      - name: Validate Fixtures
        run: bun run fixture:validate
